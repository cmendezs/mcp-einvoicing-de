[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-einvoicing-de"
version = "0.3.1"
description = "MCP server for German electronic invoicing (ZUGFeRD 2.x, XRechnung 3.x, EN 16931)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "cmendezs" }]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "e-invoicing",
    "einvoicing",
    "zugferd",
    "xrechnung",
    "en16931",
    "germany",
    "peppol",
    "ubl",
    "cii",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp-einvoicing-core>=1.1.0,<2.0.0",
    "pydantic>=2.0.0",
    "lxml>=5.0.0",
    "reportlab>=4.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "pikepdf>=8.0.0",
]

[project.optional-dependencies]
pdf = []
pymupdf = ["PyMuPDF>=1.24.0"]
# Saxon-HE for XPath 2.0 / 3.0 Schematron execution (FeRD Factur-X stylesheets).
# saxonche bundles the Saxon-HE C/C++ runtime as a Python wheel.
xslt2 = ["saxonche>=12.4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "lxml-stubs>=0.5.0",
    "types-python-dateutil>=2.9.0",
    "types-reportlab>=0.1.0",
]

[project.scripts]
mcp-einvoicing-de = "mcp_einvoicing_de.server:main"
mcp-einvoicing-de-download-rules = "mcp_einvoicing_de.download_rules:main"

[project.urls]
Homepage = "https://github.com/cmendezs/mcp-einvoicing-de"
Repository = "https://github.com/cmendezs/mcp-einvoicing-de"
Issues = "https://github.com/cmendezs/mcp-einvoicing-de/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_einvoicing_de"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_einvoicing_de --cov-report=term-missing"

[tool.coverage.run]
source = ["mcp_einvoicing_de"]
omit = ["tests/*"]
