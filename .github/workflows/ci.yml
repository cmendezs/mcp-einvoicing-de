name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies (incl. pdf and xslt2 extras)
        run: pip install -e ".[dev,pdf,xslt2]"

      - name: Lint with ruff
        run: ruff check src/mcp_einvoicing_de/ tests/ audit/

      - name: Type-check with mypy
        run: mypy src/mcp_einvoicing_de/
        continue-on-error: true  # Non-blocking until type stubs are complete

      - name: Run tests
        run: pytest --tb=short

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ── Pre-publish audit ──────────────────────────────────────────────────────
  audit:
    name: Pre-publish audit vs mcp-einvoicing-core
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + core
        run: pip install -e ".[dev]"

      - name: Run pre-publish audit
        # Exit code 2 = blocking failures → job fails
        # Exit code 1 = warnings only     → job passes (informational)
        run: python audit/audit_vs_core.py --output audit/report.json --fail-on blocking

      - name: Upload audit report
        if: always()   # Upload even on failure so the report is inspectable
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit/report.json
